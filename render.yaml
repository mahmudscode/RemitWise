# Render blueprint: New > Blueprint > pick this repo. Backend only; the frontend goes on Vercel.
services:
  - type: web
    name: remitwise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false        # set to your Vercel URL, e.g. https://remitwise.vercel.app
      - key: GROQ_API_KEY
        sync: false        # optional
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ADMIN_EMAIL
        sync: false        # provisions a real admin account (optional)
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_ACCOUNTS
        value: "true"      # set "false" outside a hackathon demo
      - key: DEMO_PASSWORD
        sync: false        # password for the demo accounts
      - key: DATABASE_URL
        sync: false        # PostgreSQL URL: keeps accounts and data across redeploys
      - key: WEB_CONCURRENCY
        value: "1"         # free plan has little CPU; raise on a paid plan (see docs/production-deployment.md)
      - key: OTP_DEMO_MODE
        value: "false"     # the code is only emailed; set SMTP_* below ("true" shows it on screen, for a demo with no mail server)
      - key: SMTP_HOST
        sync: false        # optional: any SMTP server; makes security codes real emails
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WEBHOOK_SECRET
        sync: false        # optional: enables the signed transaction webhook
